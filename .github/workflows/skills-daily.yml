name: Daily AI skill auto-install

# Every day the platform harvests a fresh batch of free AI skills from top
# GitHub repos (awesome-chatgpt-prompts etc.) into the skill gallery, so every
# user's assistant automatically keeps improving. Zero cost.

on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Silvestar skill auto-install
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          code=$(curl -s -o /tmp/sk.json -w "%{http_code}" -X POST \
            https://silvestar-api.vercel.app/api/v1/skills/auto-install \
            -H "Content-Type: application/json" \
            -H "x-cron-key: ${CRON_KEY}")
          echo "HTTP $code"; cat /tmp/sk.json | head -c 400; echo
          test "$code" = "200"
